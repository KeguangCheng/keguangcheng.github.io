{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Apply the saved preference before styles paint; first visits start in dark mode.
  var initialTheme = 'dark';
  try {
    if (localStorage.getItem('theme') === 'light') initialTheme = 'light';
  } catch (error) { /* Keep the default when browser storage is unavailable. */ }
  document.documentElement.setAttribute('data-theme', initialTheme);
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
