{% assign photos = site.data.fieldwork_photos[include.group] %}
{% if photos.size > 0 %}<div class="fieldwork-gallery{% if photos.size == 1 %} fieldwork-gallery--single{% endif %}">
{% for photo in photos %}<figure><a href="{{ photo.src | relative_url }}" aria-label="View full photograph: {{ photo.alt | escape }}"><img src="{{ photo.src | relative_url }}" alt="{{ photo.alt | escape }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy" decoding="async"></a><figcaption>{{ photo.caption }}</figcaption></figure>{% endfor %}
</div>{% endif %}
