# Based on CV_Keguang_Cheng_PhD_Formatted.docx; shared by Courses & Skills and the web CV.
- title: "HPC & Linux"
  description: "Linux/Bash and Slurm job arrays for running genomic workflows on HPC. Reproducible analysis with Git, Jupyter, R Markdown, and Shiny."
- title: "Programming & data visualization"
  description: "Python (NumPy, pandas, Biopython) and R (tidyverse, ggplot2) for data processing and visualization; Adobe Illustrator for figure preparation. SQL with MySQL and SQLite."
- title: "Genomics"
  description: "RNA-seq quality control and differential expression; de novo transcriptome assembly and evaluation; gene-family analysis, phylogenetics, population genomics, and VCF processing."
- title: "Statistical training"
  description: "Hypothesis testing; linear and logistic regression; ANOVA; PCA; bootstrap and permutation tests; false discovery rate control."
- title: "Machine learning"
  description: "Scikit-learn, classification, and cross-validation."
- title: "Wet-lab methods"
  description: "RT-PCR, gel electrophoresis, fluorescence staining, and Western blot."
- title: "Field methods"
  description: "Ecological and medicinal-plant surveys; botanical and zoological specimen collection and identification; field study design and team coordination."
